name: CI

# Runs on pull requests (tested as merged with main) and by hand.
on:
  pull_request:
    # Documentation alone cannot break the build.
    paths-ignore:
      - "docs/**"
      - "**/*.md"
  workflow_dispatch:

# A new push to a PR cancels the run of the previous push.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      # Throwaway PostgreSQL for the integration tests (each run creates and drops its own database),
      # the image and locale of docker-compose.yml's t212ext-db.
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: ci-only
          POSTGRES_INITDB_ARGS: --locale-provider=builtin --builtin-locale=C.UTF-8
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
      T212EXT_TEST_PG: Host=localhost;Port=5432;Username=postgres;Password=ci-only

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Build
        run: dotnet build T212Ext.slnx -c Release

      - name: Test
        run: >-
          dotnet test T212Ext.slnx -c Release --no-build
          --logger "trx;LogFileName=results.trx" --results-directory TestResults

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: TestResults

  # The image the server builds (docs/DEPLOYMENT.md): it must build, refuse to start without users,
  # and with one start against PostgreSQL (migrations included) and answer /health.
  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7

      - name: Check the compose file and the server scripts
        run: |
          cp .env.example .env
          T212EXT_PG_PASSWORD=ci docker compose config --quiet
          T212EXT_PG_PASSWORD=ci T212EXT_DB_PASSWORD=ci docker compose -f docker-compose.yml -f ops/postgres/copy-from-sqlserver.yml config --quiet
          rm .env
          shellcheck ops/*.sh ops/backup/*.sh

      - name: Build the image
        run: docker build -t t212ext:ci .

      - name: Smoke test
        env:
          PG: Host=pg;Database=t212ext;Username=t212ext;Password=ci-only
        run: |
          docker network create t212ext-ci
          docker run -d --name pg --network t212ext-ci -e POSTGRES_USER=t212ext -e POSTGRES_PASSWORD=ci-only -e POSTGRES_DB=t212ext \
            -e "POSTGRES_INITDB_ARGS=--locale-provider=builtin --builtin-locale=C.UTF-8" postgres:18

          # The one-time copy (3.0.0) is in the image, and says what it needs.
          if docker run --rm t212ext:ci copy-from-sqlserver 2> copy.log; then
            echo "copy-from-sqlserver ran without connection strings" >&2
            exit 1
          fi
          grep -q "ConnectionStrings:SqlServer" copy.log

          if docker run --rm -e ASPNETCORE_ENVIRONMENT=Production t212ext:ci 2> refused.log; then
            echo "Production started without users" >&2
            exit 1
          fi
          grep -q "Auth:Users is empty" refused.log

          hash="$(printf '%s\n%s\n' ci-only-password ci-only-password | docker run --rm -i t212ext:ci hash-password)"
          args=(-e ASPNETCORE_ENVIRONMENT=Production -e Sync__Enabled=false -e "ConnectionStrings__T212Ext=$PG")
          args+=(-e Auth__Users__0__Username=ci -e "Auth__Users__0__PasswordHash=$hash")
          for i in $(seq 1 40); do
            docker exec pg pg_isready -U t212ext -d t212ext && break
            sleep 2
          done
          docker run -d --name app --network t212ext-ci -p 8080:8080 "${args[@]}" t212ext:ci

          # Kestrel listens only after the migrations, so /health answering means they ran.
          for i in $(seq 1 60); do curl -fsS localhost:8080/health && break; sleep 3; done
          test "$(curl -fsS localhost:8080/health)" = Healthy
          test "$(curl -s -o /dev/null -w '%{http_code}' localhost:8080/)" = 302
          curl -fsS -D login.headers localhost:8080/login -o login.html
          grep -q 'name="Password"' login.html

          # The Content-Security-Policy (2.17.0): inline scripts run only with the request's nonce, and the
          # page's own inline scripts (the theme, the import map) carry it.
          nonce="$(grep -i '^content-security-policy:' login.headers | grep -oE "'nonce-[0-9A-F]+'" | head -n1 | cut -c8- | tr -d "'")"
          test -n "$nonce"
          grep -qi "^content-security-policy:.*frame-ancestors 'none'" login.headers
          grep -qF "<script nonce=\"$nonce\">" login.html
          grep -E '<script[^>]*importmap' login.html | grep -qF "nonce=\"$nonce\""

          # The Blazor script must be a known, fingerprinted asset that loads as JavaScript (2.4.1: the
          # image once lacked it, and every page stayed blank after sign-in).
          script="$(grep -oE '_framework/blazor\.web\.[a-z0-9]+\.js' login.html | head -n1)"
          test -n "$script"
          test "$(curl -fsS -o /dev/null -w '%{content_type}' "localhost:8080/$script")" = "text/javascript"

          # The installable app: open without sign-in, as browsers fetch them before anyone signs in.
          test "$(curl -fsS -o /dev/null -w '%{content_type}' localhost:8080/manifest.webmanifest)" = "application/manifest+json"
          curl -fsS -o /dev/null localhost:8080/service-worker.js
          curl -fsS -o /dev/null localhost:8080/icons/icon-512.png
          test "$(docker exec app id -u)" != 0

      - name: Container logs
        if: failure()
        run: docker logs app || true
