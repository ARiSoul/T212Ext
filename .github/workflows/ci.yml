name: CI

# Runs on pull requests (tested as merged with main) and by hand.
on:
  pull_request:
    # Documentation alone cannot break the build.
    paths-ignore:
      - "docs/**"
      - "**/*.md"
  workflow_dispatch:

# A new push to a PR cancels the run of the previous push.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      # Throwaway SQL Server for the integration tests (each run creates and drops its own database).
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: CiOnly_Passw0rd
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P CiOnly_Passw0rd -C -Q 'SELECT 1' -b -o /dev/null"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 12
          --health-start-period 20s

    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
      T212EXT_TEST_SQL: Server=localhost,1433;User Id=sa;Password=CiOnly_Passw0rd;TrustServerCertificate=True

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Build
        run: dotnet build T212Ext.slnx -c Release

      - name: Test
        run: >-
          dotnet test T212Ext.slnx -c Release --no-build
          --logger "trx;LogFileName=results.trx" --results-directory TestResults

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: TestResults
