name: CI

# Runs on pull requests (tested as merged with main) and by hand.
on:
  pull_request:
    # Documentation alone cannot break the build.
    paths-ignore:
      - "docs/**"
      - "**/*.md"
  workflow_dispatch:

# A new push to a PR cancels the run of the previous push.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      # Throwaway SQL Server for the integration tests (each run creates and drops its own database).
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: CiOnly_Passw0rd
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P CiOnly_Passw0rd -C -Q 'SELECT 1' -b -o /dev/null"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 12
          --health-start-period 20s

    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
      T212EXT_TEST_SQL: Server=localhost,1433;User Id=sa;Password=CiOnly_Passw0rd;TrustServerCertificate=True

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Build
        run: dotnet build T212Ext.slnx -c Release

      - name: Test
        run: >-
          dotnet test T212Ext.slnx -c Release --no-build
          --logger "trx;LogFileName=results.trx" --results-directory TestResults

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: TestResults

  # The image the server builds (docs/DEPLOYMENT.md): it must build, refuse to start without users,
  # and with one start against SQL Server (migrations included) and answer /health.
  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7

      - name: Build the image
        run: docker build -t t212ext:ci .

      - name: Smoke test
        env:
          SQL: Server=sql;Database=T212Ext;User Id=sa;Password=CiOnly_Passw0rd;TrustServerCertificate=True
        run: |
          docker network create t212ext-ci
          docker run -d --name sql --network t212ext-ci -e ACCEPT_EULA=Y -e MSSQL_SA_PASSWORD=CiOnly_Passw0rd mcr.microsoft.com/mssql/server:2022-latest

          if docker run --rm -e ASPNETCORE_ENVIRONMENT=Production t212ext:ci 2> refused.log; then
            echo "Production started without users" >&2
            exit 1
          fi
          grep -q "Auth:Users is empty" refused.log

          hash="$(printf '%s\n%s\n' ci-only-password ci-only-password | docker run --rm -i t212ext:ci hash-password)"
          args=(-e ASPNETCORE_ENVIRONMENT=Production -e Sync__Enabled=false -e "ConnectionStrings__T212Ext=$SQL")
          args+=(-e Auth__Users__0__Username=ci -e "Auth__Users__0__PasswordHash=$hash")
          for i in $(seq 1 40); do
            docker exec sql /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P CiOnly_Passw0rd -C -Q "SELECT 1" -b -o /dev/null && break
            sleep 3
          done
          docker run -d --name app --network t212ext-ci -p 8080:8080 "${args[@]}" t212ext:ci

          # Kestrel listens only after the migrations, so /health answering means they ran.
          for i in $(seq 1 60); do curl -fsS localhost:8080/health && break; sleep 3; done
          test "$(curl -fsS localhost:8080/health)" = Healthy
          test "$(curl -s -o /dev/null -w '%{http_code}' localhost:8080/)" = 302
          curl -fsS localhost:8080/login -o login.html
          grep -q 'name="Password"' login.html
          test "$(docker exec app id -u)" != 0

      - name: Container logs
        if: failure()
        run: docker logs app || true
